6"/></g><rect x="704" y="247" width="114" height="31" rx="8" fill="#eaf3ff" stroke="none" stroke-width="2"/><text x="716" y="269" font-size="18" fill="#075fbb" font-weight="600">本批已完成</text><text x="544" y="330" font-size="25" fill="#075fbb" font-weight="700">02</text><text x="593" y="330" font-size="27" fill="#142b49" font-weight="700">预处理与质量审核</text><text x="544" y="377" font-size="21" fill="#60748e" font-weight="400">T1 配准 · 功能像处理</text><text x="544" y="411" font-size="21" fill="#60748e" font-weight="400">数值 QC → 研究者视觉确认</text><text x="544" y="445" font-size="21" fill="#60748e" font-weight="400">保留科学排除与时点暂缓</text><rect x="976" y="221" width="400" height="264" rx="18" fill="white" stroke="#dce5ef" stroke-width="2"/><g transform="translate(1000 243)" fill="none" stroke="#075fbb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 12 30-4-13 31-17-27 32 23M38 8l2 27-15 4"/><circle cx="8" cy="12" r="4"/><circle cx="38" cy="8" r="4"/><circle cx="25" cy="39" r="4"/><circle cx="40" cy="35" r="4"/></g><rect x="1160" y="247" width="78" height="31" rx="8" fill="#eaf3ff" stroke="none" stroke-width="2"/><text x="1172" y="269" font-size="18" fill="#075fbb" font-weight="600">已跑通</text><text x="1000" y="330" font-size="25" fill="#075fbb" font-weight="700">03</text><text x="1049" y="330" font-size="27" fill="#142b49" font-weight="700">共同脑连接表示</text><text x="1000" y="377" font-size="21" fill="#60748e" font-weight="400">AAL90：90 脑区时序</text><text x="1000" y="411" font-size="21" fill="#60748e" font-weight="400">90×90 FC / Fisher-z</text><text x="1000" y="445" font-size="21" fill="#60748e" font-weight="400">来源与目标角色分别管理</text><rect x="976" y="557" width="400" height="264" rx="18" fill="white" stroke="#dce5ef" stroke-width="2"/><g transform="translate(1000 579)" fill="none" stroke="#075fbb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15h37l-8-8M44 33H7l8 8"/><path d="M4 22v-7M44 26v7"/></g><rect x="1160" y="583" width="132" height="31" rx="8" fill="#eaf3ff" stroke="none" stroke-width="2"/><text x="1172" y="605" font-size="18" fill="#075fbb" font-weight="600">来源训练完成</text><text x="1000" y="666" font-size="25" fill="#075fbb" font-weight="700">04</text><text x="1049" y="666" font-size="27" fill="#142b49" font-weight="700">表征学习与迁移</text><text x="1000" y="713" font-size="21" fill="#60748e" font-weight="400">源域预训练 → 目标训练折适配</text><text x="1000" y="747" font-size="21" fill="#60748e" font-weight="400">Raw FC / SSL / 固定来源对照</text><text x="1000" y="781" font-size="21" fill="#60748e" font-weight="400">五条来源训练完成，比较已执行</text><rect x="520" y="557" width="400" height="264" rx="18" fill="white" stroke="#dce5ef" stroke-width="2"/><g transform="translate(544 579)" fill="none" stroke="#075fbb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 24h14M19 24V8h22M19 24v16h22"/><circle cx="42" cy="8" r="4"/><circle cx="42" cy="40" r="4"/></g><rect x="704" y="583" width="114" height="31" rx="8" fill="#eaf3ff" stroke="none" stroke-width="2"/><text x="716" y="605" font-size="18" fill="#075fbb" font-weight="600">分类已比较</text><text x="544" y="666" font-size="25" fill="#075fbb" font-weight="700">05</text><text x="593" y="666" font-size="27" fill="#142b49" font-weight="700">分类与严重度预测</text><text x="544" y="713" font-size="21" fill="#60748e" font-weight="400">分类已比较，置换完成，增益未确立</text><text x="544" y="747" font-size="21" fill="#60748e" font-weight="400">量表定义明确后再做连续回归</text><text x="544" y="781" font-size="21" fill="#60748e" font-weight="400">分级与双任务依单任务证据推进</text><rect x="64" y="557" width="400" height="264" rx="18" fill="white" stroke="#e3c69f" stroke-width="2" stroke-dasharray="8 7"/><g transform="translate(88 579)" fill="none" stroke="#a85e14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 42V8M6 42h37M13 34l9-8 7 3 12-17"/><path d="m33 12 8 0 0 8"/></g><rect x="248" y="583" width="114" height="31" rx="8" fill="#fff4e5" stroke="none" stroke-width="2"/><text x="260" y="605" font-size="18" fill="#a85e14" font-weight="600">队列待取得</text><text x="88" y="666" font-size="25" fill="#a85e14" font-weight="700">06</text><text x="137" y="666" font-size="27" fill="#142b49" font-weight="700">新的独立队列验证</text><text x="88" y="713" font-size="21" fill="#60748e" font-weight="400">检验泛化、误差与不确定性</text><text x="88" y="747" font-size="21" fill="#60748e" font-weight="400">PTN / NRS，院方待确认</text><text x="88" y="781" font-size="21" fill="#60748e" font-weight="400">历史 SRPBS 外部检验未通过</text><path d="M464 353H509" fill="none" stroke="#075fbb" stroke-width="3" marker-end="url(#arrow)"/><path d="M920 353H965" fill="none" stroke="#075fbb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1176 485V546" fill="none" stroke="#075fbb" stroke-width="3" marker-end="url(#arrow)"/><path d="M976 689H931" fill="none" stroke="#a85e14" stroke-width="3" marker-end="url(#future)" stroke-dasharray="8 7"/><path d="M520 689H475" fill="none" stroke="#a85e14" stroke-width="3" marker-end="url(#future)" stroke-dasharray="8 7"/><rect x="64" y="872" width="1312" height="106" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/><text x="88" y="914" font-size="22" fill="#075fbb" font-weight="700">医院准备并行</text><text x="298" y="914" font-size="24" fill="#142b49" font-weight="600">PTN / NRS → 3T 协议建议 → 院方回填与现场核对。</text><text x="298" y="953" font-size="22" fill="#60748e" font-weight="400">分类完成不等于外部验证；瞳孔待论证，三维场景重建远期调研。</text><text x="64" y="1020" font-size="19" fill="#60748e" font-weight="400">依据：9月8日会议核对及会后研究记录，9月9日整理；图示不代表实时运行状态。</text></g></svg>