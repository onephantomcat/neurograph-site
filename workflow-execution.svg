<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
<title id="title">NeuroGraph 研究执行流程</title><desc id="desc">按01至06的箭头顺序：数据接入，预处理与质量审核，共同AAL90连接特征，表征学习与迁移，分类与严重度预测，新的独立队列验证。来源预训练与99/96开发性分类已完成；置换完成，增益未确立，医院准备并行，新独立验证待完成。</desc>
