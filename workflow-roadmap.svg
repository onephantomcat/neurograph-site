<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
<title id="title">NeuroGraph 多模态与Agent规划</title><desc id="desc">脑影像和临床量表已有基础；瞳孔与病历文本是扩展规划。对齐和融合后，经规划中的数据、质控、实验、证据Agent协作，提供分类、连续严重度预测和研究报告；保留研究者审核和决策。整个多模态融合与Agent系统尚未实现。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#075fbb" stroke-width="1.4"/></marker><marker id="future" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#a85e14" stroke-width="1.4"/></marker></defs>
<rect width="1440" height="1200" fill="#f5f7fb"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="64" y="61" font-size="21" fill="#075fbb" font-weight="700">NEUROGRAPH / 多模态 × AGENT</text><text x="64" y="121" font-size="40" fill="#142b49" font-weight="700">从单一影像主线，走向多模态研究协作</text><text x="64" y="163" font-size="23" fill="#60748e" font-weight="400">临床字段与协议先整理；瞳孔、融合与 Agent 待论证，三维场景重建远期调研。</text><rect x="1160" y="44" width="96" height="31" rx="8" fill="#fff4e5" stroke="none" stroke-width="2"/><text x="1172" y="66" font-size="18" fill="#a85e14" font-weight="600">规划示意</text><rect x="64" y="215" width="310" height="167" rx="18" fill="white" stroke="#dce5ef" stroke-width="2"/><g transform="translate(86 236)" fill="none" stroke="#075fbb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="38" height="38" rx="6"/><circle cx="19" cy="18" r="6"/><path d="m8 39 15-12 8 5 10-10"/></g><text x="146" y="264" font-size="29" fill="#142b49" font-weight="700">脑影像</text><text x="86" y="311" font-size="21" fill="#60748e" font-weight="400">T1 / 静息态 fMRI</text><text x="86" y="352" font-size="20" fill="#075fbb" font-weight="600">既有影像流程</text><path d="M219 382V415" fill="none" stroke="#a85e14" stroke-width="3" marker-end="url(#future)" stroke-dasharray="8 7"/><rect x="398" y="215" width="310" height="167" rx="18" fill="white" stroke="#dce5ef" stroke-width="2"/><g transform="translate(420 236)" fill="none" stroke="#075fbb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6h28v38H8V6h4M16 4h16v7H16zM15 20h17M15 28h17M15 36h10"/></g><text x="480" y="264" font-size="29" fill="#142b49" font-weight="700">临床量表</text><text x="420" y="311" font-size="21" fill="#60748e" font-weight="400">VAS / SF-MPQ2</text><text x="420" y="352" font-size="20" fill="#075fbb" font-weight="600">已审计 · 口径待核</text><path d="M553 382V415" fill="none" stroke="#a85e14" stroke-width="3" marker-end="url(#future)" stroke-dasharray="8 7"/><rect x="732" y="215" width="310" height="167" rx="18" fill="white" stroke="#e3c69f" stroke-width="2" stroke-dasharray="8 7"/><g transform="translate(754 236)" fill="none" stroke="#a85e14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 24s9-15 22-15 22 15 22 15-9 15-22 15S2 24 2 24z"/><circle cx="24" cy="24" r="7"/></g><text x="814" y="264" font-size="29" fill="#142b49" font-weight="700">瞳孔信号</text><text x="754" y="311" font-size="21" fill="#60748e" font-weight="400">设备 / 光照 / 采样 / 同步</text><text x="754" y="352" font-size="20" fill="#a85e14" font-weight="600">待论证 · 尚未采集</text><path d="M887 382V415" fill="none" stroke="#a85e14" stroke-width="3" marker-end="url(#future)" stroke-dasharray="8 7"/><rect x="1066" y="215" width="310" height="167" rx="18" fill="white" stroke="#e3c69f" stroke-width="2" stroke-dasharray="8 7"/><g transform="translate(1088 236)" fill="none" stroke="#a85e14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h25l10 10v30H7zM32 4v10h10M14 23h20M14 31h20M14 38h12"/></g><text x="1148" y="264" font-size="29" fill="#142b49" font-weight="700">病历文本</text><text x="1088" y="311" font-size="21" fill="#60748e" font-weight="400">脱敏文本与临床定义</text><text x="1088" y="352" font-size="20" fill="#a85e14" font-weight="600">待论证 · 尚未采集</text><path d="M1221 382V415" fill="none" stroke="#a85e14" stroke-width="3" marker-end="url(#future)" stroke-dasharray="8 7"/><path d="M219 415H1221" fill="none" stroke="#a85e14" stroke-width="3" stroke-dasharray="8 7"/><path d="M720 415V447" fill="none" stroke="#a85e14" stroke-width="3" marker-end="url(#future)" stroke-dasharray="8 7"/><rect x="64" y="459" width="1312" height="105" rx="18" fill="#fff4e5" stroke="#e3c69f" stroke-width="2" stroke-dasharray="8 7"/><text x="91" y="501" font-size="27" fill="#142b49" font-weight="700">多模态对齐与融合</text><text x="91" y="537" font-size="20" fill="#a85e14" font-weight="600">规划</text><text x="407" y="501" font-size="23" fill="#142b49" font-weight="400">匿名 ID 与采集时点对齐 → 缺失模态处理 → 各模态编码 → 融合表示</text><text x="407" y="537" font-size="21" fill="#60748e" font-weight="400">对比单模态、简单融合与复杂模型；只有可验证的增益才进入后续方案。</text><path d="M720 564V610" fill="none" stroke="#a85e14" stroke-width="3" marker-end="url(#future)" stroke-dasharray="8 7"/><rect x="64" y="622" width="1312" height="330" rx="18" fill="white" stroke="#e3c69f" stroke-width="2" stroke-dasharray="8 7"/><text x="90" y="668" font-size="28" fill="#142b49" font-weight="700">Agent 协作层</text><rect x="321" y="643" width="204" height="31" rx="8" fill="#fff4e5" stroke="none" stroke-width="2"/><text x="333" y="665" font-size="18" fill="#a85e14" font-weight="600">建议架构 · 未实现</text><text x="741" y="668" font-size="23" fill="#a85e14" font-weight="600">编排任务 → 调用工具 → 读取结果 → 记录证据</text><rect x="90" y="701" width="289" height="134" rx="12" fill="#f5f7fb" stroke="none" stroke-width="2"/><text x="110" y="738" font-size="25" fill="#075fbb" font-weight="700">数据 Agent</text><text x="110" y="777" font-size="21" fill="#60748e" font-weight="400">整理库存与标签</text><text x="110" y="811" font-size="21" fill="#60748e" font-weight="400">产出数据清单</text><rect x="413" y="701" width="289" height="134" rx="12" fill="#f5f7fb" stroke="none" stroke-width="2"/><text x="433" y="738" font-size="25" fill="#075fbb" font-weight="700">质控 Agent</text><text x="433" y="777" font-size="21" fill="#60748e" font-weight="400">汇总数值与图像异常</text><text x="433" y="811" font-size="21" fill="#60748e" font-weight="400">提交人工复核</text><rect x="736" y="701" width="289" height="134" rx="12" fill="#f5f7fb" stroke="none" stroke-width="2"/><text x="756" y="738" font-size="25" fill="#075fbb" font-weight="700">实验 Agent</text><text x="756" y="777" font-size="21" fill="#60748e" font-weight="400">执行既定划分与比较</text><text x="756" y="811" font-size="21" fill="#60748e" font-weight="400">回传指标和日志</text><rect x="1059" y="701" width="289" height="134" rx="12" fill="#f5f7fb" stroke="none" stroke-width="2"/><text x="1079" y="738" font-size="25" fill="#075fbb" font-weight="700">证据 Agent</text><text x="1079" y="777" font-size="21" fill="#60748e" font-weight="400">关联记录与实验结果</text><text x="1079" y="811" font-size="21" fill="#60748e" font-weight="400">生成有出处的摘要</text><text x="91" y="879" font-size="21" fill="#075fbb" font-weight="700">工具与记录</text><text x="250" y="879" font-size="23" fill="#142b49" font-weight="400">预处理脚本  ·  QC 网页  ·  训练程序  ·  项目记录</text><text x="91" y="924" font-size="23" fill="#142b49" font-weight="600">研究者负责：视觉审核、标签定义、实验方案与结论确认；Agent 不自动作出临床诊断。</text><path d="M720 952V995" fill="none" stroke="#a85e14" stroke-width="3" marker-end="url(#future)" stroke-dasharray="8 7"/><rect x="64" y="1007" width="1312" height="105" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/><text x="90" y="1050" font-size="28" fill="#075fbb" font-weight="700">研究输出</text><text x="300" y="1050" font-size="25" fill="#142b49" font-weight="600">疼痛状态分类  /  连续严重度预测  /  脑连接解释  /  有依据的研究报告</text><text x="300" y="1088" font-size="22" fill="#60748e" font-weight="400">完成独立验证后，再评估复杂图网络、LLM 与 EMR/PACS 等应用扩展。</text><text x="64" y="1158" font-size="19" fill="#60748e" font-weight="400">依据：9月8日会议 / G19、G29；Agent 为既有建议方案，会议未决定实施；自动化不等同于 Agent 系统。</text></g></svg>